<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizando Mi Entrenador…</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:grid; place-items:center; text-align:center; padding:24px; color:#23233f;
    background:linear-gradient(135deg,#7c3aed 0%,#3b82f6 100%); position:relative; overflow:hidden; }
  .blob{ position:fixed; border-radius:50%; filter:blur(60px); opacity:.5; z-index:0; }
  .b1{ width:320px; height:320px; background:#a78bfa; top:-80px; left:-60px; animation:flotar 9s ease-in-out infinite; }
  .b2{ width:280px; height:280px; background:#60a5fa; bottom:-70px; right:-50px; animation:flotar 11s ease-in-out infinite reverse; }
  @keyframes flotar{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(30px,-24px) } }
  .card{ position:relative; z-index:1; background:rgba(255,255,255,.92); backdrop-filter:blur(16px);
    border-radius:26px; padding:38px 30px; max-width:400px; width:100%;
    box-shadow:0 30px 80px rgba(30,20,80,.4); }
  .ico{ font-size:54px; margin-bottom:14px; animation:girar 1.1s ease-in-out infinite; display:inline-block; }
  @keyframes girar{ 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(180deg) } }
  h1{ font-size:21px; font-weight:900; margin-bottom:10px; }
  p{ font-size:14.5px; color:#6b6990; line-height:1.6; margin-bottom:18px; }
  .ok{ font-size:15px; font-weight:800; color:#12804a; }
  .lista{ text-align:left; font-size:13.5px; color:#4a4870; margin:0 auto 18px; max-width:280px; }
  .lista div{ padding:5px 0; }
  .lista .hecho{ color:#12804a; font-weight:800; }
  .lista .esp{ color:#b3b1d0; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <div class="ico" id="ico">⚙️</div>
    <h1 id="tit">Actualizando la app…</h1>
    <p id="sub">Estamos limpiando la versión vieja para que entren todos los cambios. No cierres esta pantalla.</p>
    <div class="lista" id="lista">
      <div id="p1"><span class="esp">⏳</span> Quitando el service worker viejo…</div>
      <div id="p2"><span class="esp">⏳</span> Borrando la caché vieja…</div>
      <div id="p3"><span class="esp">⏳</span> Cargando la versión nueva…</div>
    </div>
    <button id="btn" style="display:none;border:none;border-radius:14px;padding:15px 26px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c3aed,#3b82f6);box-shadow:0 10px 24px rgba(124,58,237,.4);cursor:pointer">Entrar a la app →</button>
  </div>
<script>
function listo(id, txt){ var e=document.getElementById(id); e.innerHTML='<span class="hecho">✓</span> '+txt; }
async function limpiar(){
  try{
    if ('serviceWorker' in navigator){
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r){ return r.unregister(); }));
    }
  }catch(e){}
  listo('p1','Service worker viejo quitado');
  try{
    if (window.caches && caches.keys){
      var keys = await caches.keys();
      await Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }
  }catch(e){}
  listo('p2','Caché vieja borrada');
  listo('p3','Versión nueva lista');
  document.getElementById('ico').textContent='✅';
  document.getElementById('tit').textContent='¡Listo!';
  document.getElementById('sub').innerHTML='<span class="ok">Todo actualizado.</span> Entrando a la app…';
  setTimeout(function(){ location.replace('./?nuevo=' + Date.now()); }, 900);
}
limpiar();
</script>
</body>
</html>
